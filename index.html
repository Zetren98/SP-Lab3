<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini-C Compiler (Lex/Yacc Analog)</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="parser.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e1e; color: #fff; margin: 0; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        textarea { width: 100%; height: 200px; background: #2d2d2d; color: #00ff00; font-family: monospace; padding: 10px; border: 1px solid #555; border-radius: 5px; }
        button { background: #ff8c00; color: #fff; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; margin-top: 10px; font-weight: bold;}
        button:hover { background: #e07b00; }
        .box { background: #252526; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        pre { background: #000; padding: 10px; color: #d4d4d4; overflow-x: auto; border-radius: 5px;}
        svg { width: 100%; height: 400px; background: #1e1e1e; border: 1px dashed #555; }
        .node circle { fill: #ff8c00; stroke: #fff; stroke-width: 2px; }
        .node text { font: 12px sans-serif; fill: #fff; }
        .link { fill: none; stroke: #555; stroke-width: 2px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Mini-C Source Code</h2>
        <textarea id="code">
int x;
x = 5;
int f;
f = 1;
while(x > 0) {
    f = f * x;
    x = x - 1;
}
print(f);
        </textarea><br>
        <button onclick="runCompiler()">Compile & Execute</button>
        
        <h3>Generated Code (Target JS):</h3>
        <pre id="generatedCode"></pre>

        <h3>Program Output (Console):</h3>
        <pre id="output"></pre>
    </div>
    
    <div class="box">
        <h2>Abstract Syntax Tree (AST)</h2>
        <svg id="ast-svg"></svg>
    </div>

    <script src="compiler.js"></script>
</body>
</html>
